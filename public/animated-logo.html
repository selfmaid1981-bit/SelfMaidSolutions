<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Maid Animated Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #f8fafc;
    overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .stage {
    position: relative;
    width: 500px;
    height: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .mascot-track {
    position: relative;
    z-index: 2;
    transform: translateX(-200px) scale(0.5);
    opacity: 0;
    animation: mascotEnter 0.8s 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards,
               mascotWipe 1s 1.1s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  .mascot-track.idle {
    animation: mascotFloat 4s ease-in-out infinite;
    transform: translateX(0) scale(1);
    opacity: 1;
  }
  .mascot-wrap {
    position: relative;
    perspective: 600px;
    transform-style: preserve-3d;
  }
  .mascot-glow {
    position: absolute;
    inset: -20%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, rgba(20,184,166,0.1) 45%, transparent 70%);
    filter: blur(18px);
    opacity: 0;
    animation: glowIn 0.5s 2.8s ease-out forwards, glowBreath 3s 3.3s ease-in-out infinite alternate;
  }
  .mascot-img {
    width: 280px;
    height: 280px;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 8px 20px rgba(59,130,246,0.3)) drop-shadow(0 2px 6px rgba(0,0,0,0.15));
  }
  .mascot-track.idle .mascot-img {
    animation: mascotGlow 3s ease-in-out infinite alternate;
  }
  .clean-streak {
    position: absolute;
    top: 20%; right: -30px;
    width: 50px; height: 60%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), rgba(59,130,246,0.15), transparent);
    border-radius: 4px;
    z-index: 3;
    opacity: 0;
    transform: skewX(-8deg);
    filter: blur(2px);
    animation: streakFlash 1s 1.1s ease-out forwards;
  }
  .text-block {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 1;
    opacity: 0;
    clip-path: inset(0 100% 0 0);
    animation: textReveal 0.8s 2s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  }
  .text-block.idle {
    opacity: 1;
    clip-path: inset(0 0 0 0);
    animation: none;
  }
  .brand {
    font-size: 52px;
    font-weight: 900;
    background: linear-gradient(135deg, #1d4ed8 0%, #0891b2 50%, #0f766e 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .text-block.idle .brand {
    animation: textShimmer 4s ease-in-out infinite;
  }
  .sub {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #64748b;
  }
  .shine {
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    z-index: 4;
    pointer-events: none;
    opacity: 0;
  }
  .text-block.idle .shine {
    animation: shineSwipe 3s 0.5s ease-in-out infinite;
  }
  .sparkles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    animation: fadeIn 0.3s 3s forwards;
  }
  .sparkle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, rgba(59,130,246,0.7) 60%, transparent 100%);
    top: 50%; left: 50%;
    opacity: 0;
    animation: sparkleFloat 3s ease-in-out var(--d, 0s) infinite;
  }
  @keyframes mascotEnter {
    to { transform: translateX(0) scale(1); opacity: 1; }
  }
  @keyframes mascotWipe {
    0% { transform: translateX(0) scale(1) rotate(0deg); }
    30% { transform: translateX(30px) scale(1.05) rotate(5deg); }
    60% { transform: translateX(-20px) scale(1.02) rotate(-3deg); }
    100% { transform: translateX(0) scale(1) rotate(0deg); }
  }
  @keyframes mascotFloat {
    0%, 100% { transform: translateY(0) rotateY(0deg); }
    25% { transform: translateY(-10px) rotateY(4deg); }
    50% { transform: translateY(-5px) rotateY(0deg); }
    75% { transform: translateY(-12px) rotateY(-4deg); }
  }
  @keyframes mascotGlow {
    0% { filter: drop-shadow(0 8px 20px rgba(59,130,246,0.3)) drop-shadow(0 2px 6px rgba(0,0,0,0.15)); }
    100% { filter: drop-shadow(0 10px 28px rgba(20,184,166,0.4)) drop-shadow(0 3px 10px rgba(59,130,246,0.2)); }
  }
  @keyframes glowIn { to { opacity: 0.7; } }
  @keyframes glowBreath {
    0% { opacity: 0.6; transform: scale(0.96); }
    100% { opacity: 1; transform: scale(1.06); }
  }
  @keyframes streakFlash {
    0% { opacity: 0; transform: skewX(-8deg) translateX(-40px); }
    30% { opacity: 0.9; }
    100% { opacity: 0; transform: skewX(-8deg) translateX(80px); }
  }
  @keyframes textReveal {
    to { opacity: 1; clip-path: inset(0 0 0 0); }
  }
  @keyframes textShimmer {
    0%, 100% { background: linear-gradient(135deg, #1d4ed8 0%, #0891b2 50%, #0f766e 100%); -webkit-background-clip: text; background-clip: text; }
    50% { background: linear-gradient(135deg, #0f766e 0%, #1d4ed8 50%, #0891b2 100%); -webkit-background-clip: text; background-clip: text; }
  }
  @keyframes shineSwipe {
    0%, 70%, 100% { left: -100%; opacity: 0; }
    75% { opacity: 0.7; }
    85% { left: 120%; opacity: 0; }
  }
  @keyframes sparkleFloat {
    0% { opacity: 0; transform: translate(-50%,-50%) translate(0,0) scale(0); }
    15% { opacity: 1; transform: translate(-50%,-50%) translate(calc(var(--sx)*0.4), calc(var(--sy)*0.4)) scale(1); }
    50% { opacity: 0.5; transform: translate(-50%,-50%) translate(var(--sx), var(--sy)) scale(0.7); }
    100% { opacity: 0; transform: translate(-50%,-50%) translate(calc(var(--sx)*1.1), calc(var(--sy)*1.1)) scale(0); }
  }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="mascot-track" id="mascotTrack">
    <div class="mascot-wrap">
      <div class="mascot-glow"></div>
      <img class="mascot-img" src="/assets/47CFE7D3-17B3-427A-ABA3-B978A17D2C68_1773578331892.png" alt="Self-Maid Mascot">
      <div class="clean-streak"></div>
    </div>
  </div>
  <div class="text-block" id="textBlock">
    <span class="brand">Self-Maid</span>
    <span class="sub">Cleaning Solutions</span>
    <div class="shine"></div>
  </div>
  <div class="sparkles" id="sparkles"></div>
</div>
<script>
  const sparklesEl = document.getElementById('sparkles');
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('span');
    s.className = 'sparkle';
    const size = 3 + Math.random() * 5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.setProperty('--d', (i * 0.45) + 's');
    s.style.setProperty('--sx', ((Math.random() - 0.5) * 400) + 'px');
    s.style.setProperty('--sy', ((Math.random() - 0.5) * 300) + 'px');
    sparklesEl.appendChild(s);
  }
  setTimeout(() => {
    document.getElementById('mascotTrack').classList.add('idle');
    document.getElementById('textBlock').classList.add('idle');
  }, 3000);
</script>
</body>
</html>
