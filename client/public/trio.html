<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayHard Trio · Owner review</title><style>body{font:16px system-ui;background:#101218;color:#f2f3f6;margin:0;padding:24px;max-width:1100px;margin:auto}h1{margin-bottom:8px}p{color:#b7bece;line-height:1.6}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #465067;border-radius:8px;background:#1b2130;color:inherit}input,textarea{box-sizing:border-box;max-width:100%}button{cursor:pointer;background:#273c62}button:disabled{opacity:.5;cursor:not-allowed}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.card{border:1px solid #353c4d;border-radius:12px;padding:20px;margin:14px 0}.tag{color:#7fdfb5}textarea{width:100%;min-height:120px;margin-top:10px}label{display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}#notice{color:#e8c981}#view:empty{display:none}</style></head><body><h1>PlayHard Trio</h1><p>PlayHard captures. LeadingEdge qualifies. Self-Maid fulfills.<br>Invitations and lead notifications require your review and authorization.</p><section id="login"><label>Owner access key <input id="key" type="password" autocomplete="off"></label><button id="connect">Open owner review</button><p>The key stays in this page’s memory and is not saved in your browser.</p></section><section id="workspace" hidden><nav><button data-tab="leads">Lead pipeline</button><button data-tab="cleaners">Cleaners</button><button data-tab="drafts">Messages to review</button><button id="lock">Lock</button></nav><p id="notice" role="status"></p><div id="view"></div></section><script type="module">
let access='',active='leads';const $=id=>document.getElementById(id),view=$('view');
function el(tag,text,parent){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text);if(parent)parent.append(node);return node;}
function button(text,parent,fn){const b=el('button',text,parent);b.onclick=fn;return b;}
async function api(action,payload){const r=await fetch('/api/trio?action='+action,{method:payload?'POST':'GET',headers:{Authorization:'Bearer '+access,...(payload?{'Content-Type':'application/json'}:{})},...(payload?{body:JSON.stringify(payload)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}
async function load(){view.replaceChildren();$('notice').textContent='Loading…';try{const d=await api(active);$('notice').textContent='No messages send automatically. Delivery remains disabled until it is configured.';const rows=d[active]||[];if(!rows.length)el('p','Nothing here yet.',view);for(const row of rows){const card=el('article',undefined,view);card.className='card';if(active==='leads'){el('h2',row.contact.name,card);el('p',[row.contact.email,row.contact.phone].filter(Boolean).join(' · '),card);el('p',row.source_app+' → '+row.owner_app+' · '+row.status,card);el('pre',JSON.stringify({service:row.service,details:row.details,qualification:row.qualification},null,2),card);if(row.owner_app==='leading_edge'&&['new','qualifying','qualified'].includes(row.status)){const label=el('label','Qualification score (0–100) ',card),score=el('input',undefined,label);score.type='number';score.min='0';score.max='100';score.value=row.qualification.score??'';button('Save qualification',card,()=>{if(score.value.trim()===''){$('notice').textContent='Enter a qualification score first.';return;}mutate('qualify',{leadId:row.id,qualification:{score:Number(score.value)}});});button('Hand off to Self-Maid',card,()=>mutate('handoff',{leadId:row.id}));el('p','Handoff requires a qualified cleaning service and recorded contact permission.',card);}if(row.owner_app==='self_maid'){const next={new:'quoted',handed_off:'quoted',quoted:'scheduled',scheduled:'in_progress',in_progress:'completed',completed:'qa_pending',qa_pending:'qa_complete',qa_complete:'follow_up',follow_up:'retained'}[row.status];if(next)button('Mark '+next.replaceAll('_',' '),card,()=>mutate('status',{leadId:row.id,status:next}));}}
else if(active==='cleaners'){el('h2',row.name,card);el('p',row.business_name||row.affiliation||'',card);el('p','Status: '+row.status+' · notifications '+(row.notifications_enabled?'enabled':'disabled'),card);el('p',row.email||row.phone||'Contact details still needed.',card);}
else{el('h2',row.subject,card);el('p',row.kind+' · '+row.state,card);el('p','Recipient: '+(row.recipient||'Not yet verified'),card);el('pre',row.body,card);const send=button('Approve & send',card,()=>{});send.disabled=true;send.title='Delivery is not configured. Nothing will be sent.';}}
}catch(e){$('notice').textContent=e.message;}}
async function mutate(action,payload){try{await api(action,{...payload,eventId:crypto.randomUUID()});await load();}catch(e){$('notice').textContent=e.message;}}
$('connect').onclick=async()=>{access=$('key').value.trim();$('key').value='';$('login').hidden=true;$('workspace').hidden=false;await load();};$('lock').onclick=()=>{access='';view.replaceChildren();$('workspace').hidden=true;$('login').hidden=false;};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;load();});
</script></body></html>
