name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate ecosystem handoff contract
        run: npm run handoff:validate

      - name: Production build
        run: npm run build

      - name: Legacy type-check inventory
        continue-on-error: true
        run: npm run check
